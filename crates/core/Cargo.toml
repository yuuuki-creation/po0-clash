[package]
name = "po0-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "po0_core"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
rquickjs = { version = "0.12", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# rquickjs ships pre-generated bindings for every target but Android, where bindgen makes them at build time.
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.12", default-features = false, features = ["bindgen"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
sysproxy = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
