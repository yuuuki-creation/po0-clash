[package]
name = "po0-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "po0_ffi"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
po0-core = { path = "../core" }
uniffi = "0.32"
