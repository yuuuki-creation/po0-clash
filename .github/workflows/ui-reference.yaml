name: ui-reference

on:
  push:
    branches: ['native-ui']
    paths: ['.github/workflows/ui-reference.yaml']
  workflow_dispatch:
    inputs:
      artifact_run:
        description: native-release run containing the Windows installer
        required: true

permissions:
  contents: read
  actions: read

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
          run-id: ${{ inputs.artifact_run || '43228696607' }}
          github-token: ${{ github.token }}
      - name: Install official Clash Verge Rev and po0-clash
        shell: pwsh
        run: |
          $url = 'https://github.com/clash-verge-rev/clash-verge-rev/releases/download/v2.5.10/Clash.Verge_2.5.10_x64-setup.exe'
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\official-verge.exe"
          Get-FileHash "$env:RUNNER_TEMP\official-verge.exe" -Algorithm SHA256
          $policy = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name 'clash-verge.exe' -Value '--remote-debugging-port=9223' -Force | Out-Null
          New-ItemProperty -Path $policy -Name 'po0-clash.exe' -Value '--remote-debugging-port=9222' -Force | Out-Null
          $setup = Start-Process "$env:RUNNER_TEMP\official-verge.exe" -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "official installer exited with $($setup.ExitCode)" }
          $official = Get-ChildItem 'C:\Program Files', "$env:LOCALAPPDATA\Programs" -Filter clash-verge.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $official) { throw 'official app executable not found' }
          Start-Process $official.FullName
          $installer = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          $setup = Start-Process $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "po0 installer exited with $($setup.ExitCode)" }
          Start-Process 'C:\Program Files\po0-clash\po0-clash.exe'
      - run: npm ci --no-fund --no-audit
        working-directory: apps/windows
      - run: node tool/ui/windows-reference.mjs
      - run: node apps/windows/scripts/smoke.mjs
      - name: Stop test apps
        if: always()
        shell: pwsh
        run: Get-Process po0-clash, clash-verge, mihomo -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-windows-comparison
          path: reference-shots

  android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: release
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: Compare official FlClash and po0-clash
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/reference-avd
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$ANDROID_AVD_HOME" reference-android
          curl -fL --retry 3 https://github.com/chen08209/FlClash/releases/download/v0.9.3/FlClash-0.9.3-android-x86_64.apk -o reference.apk
          echo '71884cc9b7bad834608ab5e51cf6f59f1f01074ad7c4e779c40da8958060b81e  reference.apk' | sha256sum -c -
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'system-images;android-35;google_apis;x86_64' 'emulator' > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n reference -k 'system-images;android-35;google_apis;x86_64' --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -avd reference -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > reference-android/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 2; done'
          adb shell input keyevent 82
          adb root
          adb wait-for-device
          adb install reference.apk
          adb install release/*-android-x86_64.apk
          python3 tool/ui/android-reference.py
      - name: Collect diagnostics
        if: always()
        run: |
          timeout 10 "$ANDROID_HOME/platform-tools/adb" logcat -d > reference-android/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-android-comparison
          path: reference-android
